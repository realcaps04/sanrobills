# Pings Supabase Postgres via PostgREST so Free Plan projects stay active.
# Free projects can pause after ~7 days with too little database activity.
# Do NOT use /auth/v1/health — it does not query Postgres.
#
# Setup (one-time):
# 1. Run supabase/keep_alive.sql in the Supabase SQL Editor
# 2. GitHub repo → Settings → Secrets and variables → Actions → New repository secret:
#      SUPABASE_URL        = https://xxxx.supabase.co
#      SUPABASE_ANON_KEY   = your anon/public key
# 3. Actions → Supabase keep-alive → Run workflow (to verify)

name: Supabase keep-alive

on:
  schedule:
    # Monday + Thursday 06:00 UTC (~twice a week)
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep_alive table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing GitHub secrets: SUPABASE_URL and/or SUPABASE_ANON_KEY"
            exit 1
          fi

          url="${SUPABASE_URL%/}/rest/v1/keep_alive?select=id&limit=1"
          echo "GET $url"

          code=$(curl -sS -o /tmp/keepalive.json -w "%{http_code}" "$url" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json")

          echo "HTTP $code"
          cat /tmp/keepalive.json
          echo

          if [ "$code" != "200" ]; then
            echo "Keep-alive failed. Did you run supabase/keep_alive.sql?"
            exit 1
          fi

          echo "OK — database activity recorded"
